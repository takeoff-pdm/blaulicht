[package]
name = "blaulicht-engine"
version = "0.30.0"
authors = ["MikMuellerDev"]
edition = "2021"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
rust-version = "1.76"
description = "The Blaulicht engine: DMX, plugins, audio bridge, show state and persistence, without a UI."

[features]
default = ["audio", "wasmtime"]
wasmtime = ["dep:rustc-demangle", "dep:wasmtime"]
audio = ["dep:audioviz", "dep:cpal", "blaulicht-audio-engine/stream_in"]
# No real audio input, only the dummy inputs (which every build has).
audio-mock = []
dhat = ["dep:dhat"]

[dependencies]

# Audio
audioviz = { version = "0.6.0", features = ["serde"], optional = true }
audio_thread_priority = "0.34.0"
cpal = { version = "0.15.3", optional = true }
# `noise`: the dummy inputs ("Dummy: Noise", "Dummy: Silence") are always there.
blaulicht-audio-engine = { path = "../audio_engine/", default-features = false, features = ["noise"] }

# Default
serde = { version = "1", features = ["derive"] }
spin_sleep = "1.2.1"
anyhow = "1.0.94"
toml = "0.8.19"
serde_json = "1.0.135"
crossbeam-channel = "0.5.14"
itertools = "0.14.0"
rand = "0.9.2"
blaulicht-shared = { path = "../shared" }
maplit = "1.0.2"
strum = { version = "0.27.2", features = ["derive"] }
artnet_protocol = "0.4.4"
dhat = { version = "0.3.3", optional = true }
clap = { version = "4.5.56", default-features = false, features = ["derive"] }
sha2 = "0.10"
tempdir = "0.3.7"
tracing = "0.1.44"
# `Instant` / `SystemTime` that also work in a browser (std's panic on
# wasm32-unknown-unknown); a re-export of std::time on native. clippy.toml
# keeps std's out.
web-time = "1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Remote clients (`server`, `client::RemoteClient`): sync websockets, no
# async runtime; bincode (serde mode) and JSON on the wire.
tungstenite = "0.24"
bincode = { version = "2.0.1", features = ["serde"] }

# Wasm
wasmtime = { version = "31.0.0", optional = true, features = [ "all-arch" ] }
rustc-demangle = { version = "0.1.26", optional = true }
notify = "7.0.0"

# DMX
serialport = "4.7.3"

# Native only: the web frontend (ticket 054) compiles this crate for wasm32
# for its client and wire types, and neither builds there (midir's Web MIDI
# backend is broken; thread-priority needs libc). `plugin::midi` and `util`
# have inert wasm32 stand-ins.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
thread-priority = "1.2.0"
midir = "0.10.1"

# The browser transport of `client::RemoteClient` (the web frontend).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event"] }

[target.'cfg(unix)'.dependencies]
# Signal handling of the headless binary.
nix = { version = "0.26.4", default-features = false, features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach = "0.3"
libc = "0.2"
