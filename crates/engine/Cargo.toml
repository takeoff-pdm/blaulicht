[package]
name = "blaulicht-engine"
version = "0.30.0"
authors = ["MikMuellerDev"]
edition = "2021"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
rust-version = "1.76"
description = "The Blaulicht engine: DMX, plugins, audio bridge, show state and persistence, without a UI."

[features]
default = ["audio", "wasmtime"]
wasmtime = ["dep:rustc-demangle", "dep:wasmtime"]
audio = ["dep:audioviz", "dep:cpal", "blaulicht-audio-engine/stream_in", "blaulicht-audio-engine/noise"]
audio-mock = ["blaulicht-audio-engine/noise"]
dhat = ["dep:dhat"]

[dependencies]

# Audio
audioviz = { version = "0.6.0", features = ["serde"], optional = true }
audio_thread_priority = "0.34.0"
cpal = { version = "0.15.3", optional = true }
blaulicht-audio-engine = { path = "../audio_engine/", default-features = false }

# Default
serde = { version = "1", features = ["derive"] }
spin_sleep = "1.2.1"
anyhow = "1.0.94"
toml = "0.8.19"
serde_json = "1.0.135"
crossbeam-channel = "0.5.14"
itertools = "0.14.0"
rand = "0.9.2"
thread-priority = "1.2.0"
blaulicht-shared = { path = "../shared" }
maplit = "1.0.2"
strum = { version = "0.27.2", features = ["derive"] }
artnet_protocol = "0.4.4"
dhat = { version = "0.3.3", optional = true }
clap = { version = "4.5.56", default-features = false, features = ["derive"] }
sha2 = "0.10"
tempdir = "0.3.7"
tracing = "0.1.44"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Wasm
wasmtime = { version = "31.0.0", optional = true, features = [ "all-arch" ] }
rustc-demangle = { version = "0.1.26", optional = true }
notify = "7.0.0"

# Midi
midir = "0.10.1"

# DMX
serialport = "4.7.3"

[target.'cfg(target_os = "macos")'.dependencies]
mach = "0.3"
libc = "0.2"
