<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- The UI zooms itself to the window; the browser must not. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Full screen when added to a tablet's home screen. -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#1b1b1b">
    <title>Blaulicht</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1b1b1b;
            color: #d0d0d0;
            font-family: system-ui, sans-serif;
            /* No pull-to-refresh, pinch zoom or double-tap zoom over the UI. */
            overscroll-behavior: none;
            touch-action: none;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .notice {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            max-width: 32em;
            padding: 1em 1.5em;
            text-align: center;
        }

        #crash {
            display: none;
            white-space: pre-wrap;
            text-align: left;
            background: #3a1515;
            border: 1px solid #a33;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <canvas id="blaulicht_canvas"></canvas>
    <div id="loading" class="notice">Loading Blaulicht...</div>
    <div id="crash" class="notice"></div>
    <noscript><div class="notice">The Blaulicht web UI needs JavaScript and WebAssembly.</div></noscript>
    <script type="module">
        import init from "./blaulicht_web.js";
        init().catch((error) => {
            const crash = document.getElementById("crash");
            crash.textContent = "The web UI could not load: " + error;
            crash.style.display = "block";
        });
    </script>
</body>
</html>
