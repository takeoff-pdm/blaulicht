[package]
name = "blaulicht-ui-egui"
version = "0.30.0"
authors = ["MikMuellerDev"]
edition = "2021"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
rust-version = "1.76"
description = "The native egui frontend (desk) of Blaulicht, built on the engine's EngineClient."

[features]
# Wayland by default, like the desk binary; binaries pick the platform with
# default-features = false.
default = ["visualizer", "file-dialog", "plugin-popout", "wayland"]
# The 3D visualizer and stage editor (three-d, glow). Without it the page
# shows a notice.
visualizer = ["dep:three-d", "dep:three-d-asset", "dep:egui_glow", "dep:image", "dep:bytemuck"]
# Native file dialogs: showfile Load / Save As and the visualizer's model
# import.
file-dialog = ["dep:egui-file-dialog", "dep:sysinfo"]
# Plugin UI windows that pop out into their own native viewport.
plugin-popout = []
wayland = ["eframe/wayland"]
x11 = ["eframe/x11"]

[dependencies]
blaulicht-engine = { path = "../engine", default-features = false }
blaulicht-audio-engine = { path = "../audio_engine/", default-features = false }
blaulicht-shared = { path = "../shared" }
blaulicht-assets = { path = "../assets" }

serde = { version = "1", features = ["derive"] }
anyhow = "1.0.94"
serde_json = "1.0.135"
crossbeam-channel = "0.5.14"
map-range = "0.1.2"
strum = { version = "0.27.2", features = ["derive"] }
chrono = "0.4.42"
tracing = "0.1.44"
clap = { version = "4.5.56", default-features = false, features = ["derive"] }

# Egui
egui = "0.34.1"
egui_extras = { version = "0.34.1", features = ["svg"] }
egui_dock = "0.19.1"
eframe = { version = "0.34.1", default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    #"persistence",   # Enable restoring app state when restarting the app.
] }
egui_plot = "0.35.0"
egui-phosphor = "0.12.0"
egui_code_editor = { version = "=0.2.24" }
egui_glow = { version = "0.34.1", optional = true }
egui-file-dialog = { version = "0.13.0", optional = true }
egui-snarl = { version = "0.10", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["bmp"], optional = true }
bytemuck = { version = "1.14.3", optional = true }
sysinfo = { version = "0.30.13", optional = true }
three-d = { version = "0.19", default-features = false, optional = true }
three-d-asset = { version = "0.10", default-features = false, features = ["gltf", "png", "jpeg"], optional = true }
fdg-sim = "0.9.1"

[dev-dependencies]
tempdir = "0.3.7"
