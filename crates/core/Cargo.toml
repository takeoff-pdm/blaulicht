[package]
name = "blaulicht-core"
version = "0.3.0"
authors = ["MikMuellerDev"]
edition = "2021"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
rust-version = "1.76"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]


[features]
default = [] # ["wasmtime"]   # keep it on by default
wasmtime = ["dep:wasmtime"]

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
spin_sleep = "1.2.1"
cpal = "0.15.3"
simple_logger = "5.0.0"
audioviz = { version = "0.4.4", features = ["serde"] }
anyhow = "1.0.94"
toml = "0.8.19"
# actix-web = "4.9.0"
serde_json = "1.0.135"
crossbeam-channel = "0.5.14"
env_logger = "0.11.6"
# actix = "0.13.5"
# actix-web-actors = "4.3.1"
# actix-ws = "0.3.0"
itertools = "0.14.0"
wasmtime = { version = "31.0.0", optional = true }
midir = "0.10.1"
wmidi = "4.0.10"
enttecopendmx = "0.1.1"
thread-priority = "1.2.0"
notify = "7.0.0"
blaulicht-shared = { path = "../shared" }
blaulicht-audio-engine = { path = "../audio_engine/" }
crossbeam-queue = "0.3.12"
heapless = "0.8.0"
maplit = "1.0.2"
egui = "0.32"
eframe = { version = "0.32", default-features = false, features = [
    #"accesskit",     # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    #"persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # To support Linux (and CI)
    "x11",           # To support older Linux distributions (restores one of the default features)
] }
map-range = "0.1.2"
egui_plot = "0.33.0"
strum = { version = "0.27.2", features = ["derive"] }
noise = "0.9.0"
color_space = "0.5.4"
serialport = "4.7.3"
chrono = "0.4.42"
egui_file = "0.23.1"
postcard = { version = "1.1.3", features = ["use-std"] }
egui-phosphor = "0.10.0"
image = "0.25.6"
serde_with = "3.16.0"
ron = "0.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
mach = "0.3"
libc = "0.2"
