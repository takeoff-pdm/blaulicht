port = 1234
dmx_out_devices = [
    "/dev/dmx_out_0",
    "/dev/dmx_out_0",
]
run_setup_on_reload = false
spectrogram_window_seconds = 10
spectrogram_refresh_hz = 60
last_open_showfile = "/home/mik/BL_DBG.json"

[stream]
fft_resolution = 4096
gravity = 100.0
refresh_rate = 60

[stream.processor]
frequency_bounds = [
    40,
    20000,
]
interpolation = "Cubic"
position_normalisation = "Harmonic"
sample_rate = 44100
volume = 1.0
volume_normalisation = "Mixture"

[[plugins]]
file_path = "../plugins/bundle_debug/midi_all.wasm"
enabled = true
enable_watcher = true

[[plugins]]
file_path = "../plugins/bundle_debug/sample_egui_plugin.wasm"
enabled = false
enable_watcher = true

[[plugins]]
file_path = "../plugins/bundle_debug/drums.wasm"
enabled = false
enable_watcher = true

[[plugins]]
file_path = "../plugins/bundle_debug/433mhz_antenna.wasm"
enabled = false
enable_watcher = true

[[plugins]]
file_path = "../plugins/bundle_debug/visualizer.wasm"
enabled = false
enable_watcher = true

[[plugins]]
file_path = "../plugins/bundle_debug/test.wasm"
enabled = true
enable_watcher = true

[[plugins]]
file_path = "../plugins/bundle_debug/videowall.wasm"
enabled = true
enable_watcher = true

[plugin_state]
