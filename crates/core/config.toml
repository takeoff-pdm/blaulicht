port = 1234
default_audio_device = "pipewire"
last_open_showfile = "/home/mik/BL2.txt"

[stream]
fft_resolution = 4096
refresh_rate = 60
gravity = 100.0

[stream.processor]
sample_rate = 44100
frequency_bounds = [
    40,
    20000,
]
volume = 1.0
volume_normalisation = "Mixture"
position_normalisation = "Harmonic"
interpolation = "Cubic"

[[plugins]]
file_path = "../plugins/bundle_debug/midi_korg_nano_kontrol.wasm"
enabled = true
enable_watcher = true

[[plugins]]
file_path = "../plugins/bundle_debug/sample_egui_plugin.wasm"
enabled = true
enable_watcher = true

[[plugins]]
file_path = "../plugins/bundle_debug/drums.wasm"
enabled = true
enable_watcher = true
