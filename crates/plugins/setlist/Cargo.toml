[package]
name = "blaulicht-plugin-setlist"
version = "0.1.0"
edition = "2021"
description = "Follows a pre-analyzed setlist and fires cues ahead of the music"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blaulicht-setlist = { path = "../../setlist" }
blaulicht-shared = { path = "../../shared" }
blaulicht-plugin-framework = { path = "../../plugin_framework" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
overflow-checks = false
strip = "debuginfo"
