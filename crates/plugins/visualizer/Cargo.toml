[package]
name = "blaulicht-plugin-visualizer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
blaulicht-shared = { path = "../../shared" }
blaulicht-plugin-framework = { path = "../../plugin_framework" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
overflow-checks = false
strip = "debuginfo"

