[package]
name = "blaulicht-midilight"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
blaulicht-shared = { path = "../../shared" }
blaulicht-plugin-framework = { path = "../../plugin_framework" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

