port = 1234
dmx_out_devices = [
    "/dev/dmx_out0",
    "/dev/dmx_out1",
]
default_audio_device = "pipewire"
run_setup_on_reload = false
spectrogram_window_seconds = 120
spectrogram_refresh_hz = 60

[stream]
channel_count = 2
fft_resolution = 2048
refresh_rate = 60
gravity = 100.0

[stream.processor]
sampling_rate = 44100
frequency_bounds = [
    50,
    20000,
]
volume = 1.0
volume_normalisation = "Mixture"
position_normalisation = "Harmonic"
interpolation = "Cubic"

[[plugins]]
file_path = "./plugins/hello_world.wasm"
enabled = false
enable_watcher = false

[plugin_state]
