<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Blaulicht Pages draft</title>
<link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="system.css"><link rel="stylesheet" href="pages.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script></head><body>
<div class="shell"><nav class="nav" id="nav"></nav><main class="syswork"><div id="content"></div></main>
<footer class="status"></footer><script src="chrome.js"></script></div>
<script src="pagesdata.js"></script>
<script>
const $=i=>document.getElementById(i),P=window.PAGES,scene=i=>P.scenes.find(s=>s.id===i);$("sf").textContent=P.file;
const R=["logs","audio","views","performance","graph","visualizer"],page=()=>R.includes(location.hash.slice(1))?location.hash.slice(1):"logs";
const SUB=[["System",["General","DMX & Art-Net","Plugins","MIDI & Serial","Screens","Remote UI"]],["Setup",["Fixtures","Groups","Scenes","Animations","Palettes"]]];
const it=(k,n,i)=>`<button class="link ${page()===k?"on":""}" data-go="${k}"><i class="ph ph-${i}"></i>${n}</button>`,subs=n=>SUB.find(s=>s[0]===n)[1].map(x=>`<button class="sub">${x}</button>`).join("");
const SPD=["_1_16","_1_8","_1_4","_1_2","_1","_2","_4","_8","_16","_32"],spl=s=>s.slice(1).replace("_","/")+"x";
function speedKnob(i,sp){const t=Math.max(0,SPD.indexOf(sp))/9,st=Math.PI*.6,sw=Math.PI*1.8,pt=(a,r)=>[50+r*Math.cos(a),50+r*Math.sin(a)].map(v=>v.toFixed(1));let tk="";for(let k=0;k<10;k++){const a=st+sw*k/9,[x1,y1]=pt(a,41),[x2,y2]=pt(a,47);tk+=`<line class="pgk-t ${k/9<=t?"on":""}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;}const a=st+sw*t,[px,py]=pt(a,30),[qx,qy]=pt(a,12);return `<div class="pgk" data-sk="${i}" title="Drag up or down to change speed"><svg viewBox="0 0 100 100" aria-hidden="true">${tk}<circle class="pgk-f" cx="50" cy="50" r="36"/><line class="pgk-p" x1="${qx}" y1="${qy}" x2="${px}" y2="${py}"/></svg><b>${spl(sp)}</b><span>Speed</span></div>`;}
document.addEventListener("pointerdown",e=>{const k=e.target.closest("[data-sk]");if(!k)return;const i=+k.dataset.sk,s=scene(i);let y=e.clientY,acc=0;const mv=m=>{acc+=y-m.clientY;y=m.clientY;if(Math.abs(acc)>=14){const n=Math.max(0,Math.min(9,SPD.indexOf(s.speed)+Math.sign(acc)));acc=0;s.speed=SPD[n];document.querySelector(`[data-sk="${i}"]`).outerHTML=speedKnob(i,s.speed);}};addEventListener("pointermove",mv);addEventListener("pointerup",()=>removeEventListener("pointermove",mv),{once:true});});
document.addEventListener("click",e=>{const a=e.target.closest("[data-addov]");if(a){S.overlays=[...ovs(),+a.dataset.addov];draw();}});
function nav(){$("nav").innerHTML=`<div class="logo"><img src="logo_blaulicht.svg" alt="blaulicht"><button class="fold" aria-label="Collapse the sidebar"><i class="ph ph-caret-double-left"></i></button></div><h2>System</h2>${it("logs","Logs","terminal-window")}<button><i class="ph ph-gear"></i>System</button>${subs("System")}<h2>Setup</h2>${it("audio","Audio","waveform")}<button><i class="ph ph-wrench"></i>Setup</button>${subs("Setup")}<h2>Live</h2>${it("views","Views","stack")}${it("performance","Perform","game-controller")}<button><i class="ph ph-faders"></i>Programmer</button>${it("graph","Scene Graph","graph")}${it("visualizer","Visualizer","cube-focus")}`;}
$("nav").onclick=e=>{const B=e.target.closest("button");if(!B)return;const n=B.textContent.trim(),X={System:"system.html",General:"system.html#general","DMX & Art-Net":"system.html#dmx",Plugins:"system.html#plugins","MIDI & Serial":"system.html#devices",Screens:"system.html#screens","Remote UI":"system.html#remote",Setup:"setup.html",Fixtures:"setup.html#fixtures",Groups:"setup.html#groups",Scenes:"setup.html#scenes",Animations:"animation-editor.html",Palettes:"setup.html#palettes",Programmer:"programmer.html"};if(X[n]){location.href=X[n];return;}const b=e.target.closest("[data-go]");if(b)location.hash=b.dataset.go;};
const pane=(t,b,r="",c="")=>`<section class="pane ${c}"><header>${t}${r?`<span class="hr">${r}</span>`:""}</header>${b}</section>`;
const fader=(n,v,max=100,lab=n,id="")=>`<div class="strip" data-name="${id||n}"><div class="track" data-max="${max}" style="--v:${v*100/max}"><div class="scale"></div><div class="mask"></div><div class="slot"></div><div class="cap"><i class="bevel"></i><i class="ridges"></i><i class="ridges low"></i><i class="ind"></i></div></div><span class="val num">${Math.round(v)}</span><span class="name">${lab}</span></div>`;
const sp=s=>s.slice(1).replace("_","/")+"x",SPEEDS=["_1_16","_1_8","_1_4","_1_2","_1","_2","_4","_8","_16","_32"];
const speedSel=(id,v)=>`<select class="pg-speed" data-speed="${id}" aria-label="Speed">${SPEEDS.map(s=>`<option ${s===v?"selected":""} value="${s}">${sp(s)}</option>`).join("")}</select>`;
/* Log lines are a sample based on a real startup in the blenv container. */
let logs=[["08:47:02.114","INFO","init","Starting BLAULICHT 0.30.0"],["08:47:02.131","INFO","init",`Using default audio device: <${P.audio.device}> from configuration file.`],["08:47:02.140","DEBUG","config","Loaded ./config.toml (11 plugins, port 1234)"],["08:47:02.162","INFO","engine","Supervisor started"],["08:47:02.170","INFO","server","Web UI on http://0.0.0.0:1234/"],["08:47:02.204","WARN","midi",'Initial device enumeration failed: Other("MIDI support could not be initialized")'],["08:47:02.219","ERROR","dmx",'Could not establish link to DMX interface "/dev/dmx_out1" (baud = 250000): No such file or directory'],["08:47:02.220","INFO","dmx","Retrying in 5 s"],["08:47:12.488","INFO","plugin","Loaded plugin <./crates/plugins/bundle_debug/inspector.wasm> (ABI 13, 4.1 ms)"],["08:47:18.902","INFO","plugin","Loaded plugin <./crates/plugins/bundle_debug/midi_all.wasm> (ABI 13, 3.7 ms)"],["08:47:34.015","INFO","udp","Listening on 127.0.0.1:9099"],["08:47:34.022","DEBUG","audio","Stream opened: 48000 Hz, 2 ch, buffer 512"],["08:47:34.031","INFO","engine","Beat detection: Tracker"],["08:47:34.040","WARN","engine","Failed to raise engine thread priority: the operating system returned error code 13"],["08:47:41.377","INFO","persist","Autosaved show.json (12 ms)"]];
const L={q:"",lv:new Set(["DEBUG","INFO","WARN","ERROR"]),src:null,auto:true,sel:null};
const S={view:0,graphSample:false,node:0,mode:"View",tool:"Select",fx:null,opts:{Room:true,Grid:true,Axes:false,Beams:true,Bodies:true,Labels:false},manual:false,black:false,gm:100,live:false,cal:true,cleared:false,overlays:null};
const ovs=()=>S.overlays||(S.overlays=[...P.current]);
const V={
logs(){const src=[...new Set(logs.map(l=>l[2]))],rows=logFilter(),n=v=>logs.filter(l=>l[1]===v).length,LV=[["DEBUG","Debug"],["INFO","Info"],["WARN","Warn"],["ERROR","Error"]];
 return `<div class="pg pg-logs"><div class="pg-bar"><b class="lg-title">Logs</b><label class="lg-search"><i class="ph ph-magnifying-glass"></i><input class="pg-input" id="lq" aria-label="Filter log text" placeholder="Filter messages" value="${L.q}"></label><button class="ddbtn lg-lvbtn" id="llv" aria-haspopup="listbox" aria-label="Filter levels"><i class="ph ph-funnel"></i>${L.lv.size===4?"All levels":L.lv.size?LV.filter(([l])=>L.lv.has(l)).map(([,t])=>t).join(", "):"No levels"}<i class="ph-bold ph-caret-down ddcv"></i></button><select class="pg-input" id="ls" aria-label="Filter source" style="width:110px"><option value="">All sources</option>${src.map(s=>`<option ${L.src===s?"selected":""}>${s}</option>`).join("")}</select><span class="lg-sp"></span><button class="mini lg-ic ${L.auto?"primary":""}" id="la" title="Follow new lines"><i class="ph ph-arrow-line-down"></i>Follow</button><button class="mini lg-ic" title="Copy visible lines"><i class="ph ph-copy"></i></button><button class="mini lg-ic" id="lc" title="Clear"><i class="ph ph-trash"></i></button></div>`+`<section class="pane lg-pane"><div class="body lg-body" id="lb"><table class="pg-log"><thead><tr><th class="t">Time</th><th class="l">Level</th><th class="s">Source</th><th class="m">Message</th></tr></thead><tbody id="lt">${logRows(rows)}</tbody></table></div><div class="lg-foot" id="lf">${logFoot(rows)}</div></section></div>`;},
audio(){return `<div class="pg pg-audio">`+pane("Spectrum",`<div class="pg-wrap"><div class="pg-bars" id="bars"></div></div>`,`<span class="pg-tag">Simulated</span>`,"").replace('class="pane "','class="pane" style="grid-area:spec"')+
 `<section class="pane" style="grid-area:ctrl"><header>Input<span class="hr"><span class="mono">${P.audio.device}</span><button class="mini">Change device</button></span></header><div class="pg-ctrl">${fader("Volume",100,100,"Volume","Volume")}${fader("Gate",12,100,"Gate","Gate")}${fader("Boost",40,255,"Boost","Boost")}<div class="pg-note"><dl class="kv"><dt>Sample rate</dt><dd>${P.audio.rate} Hz</dd><dt>FFT size</dt><dd>${P.audio.fft}</dd></dl><br><label><input type="checkbox" id="cal" ${S.cal?"checked":""}> Auto-calibrate</label></div></div></section>`+
 `<div class="pg-col" style="grid-area:beat">`+pane("Beat detection",`<div class="pg-frm"><label>Status</label><span class="state ok">Detecting</span><label>Tempo</label><span class="mono">128.0 BPM</span><label>Section</label><span>Sample value</span><label for="mb">Manual BPM</label><span><input type="checkbox" id="mb" ${S.manual?"checked":""} aria-label="Use manual BPM"> <input class="pg-input" style="width:80px" aria-label="Manual BPM" value="128" ${S.manual?"":"disabled"}></span></div><p class="pg-note">Manual BPM bypasses tempo detection and pins the beat scheduler.</p>`)+pane("Frequency bands",`<table class="rows">${["Bass","Mid","Treble"].map((b,i)=>`<tr><td>${b}</td><td class="r mono" id="b${i}">-</td></tr>`).join("")}</table><p class="pg-note">Simulated. The real analysis dialog has more: signal, loop tempo worker, beat tracker and beat model.</p>`,"","pg-grow")+`</div></div>`;},
views(){const v=P.views[S.view],o=v?v.overlays:[];return `<div class="pg pg-views">`+pane("Views",`<div class="body">${P.views.map((x,i)=>`<button class="li ${i===S.view?"on":""}" data-view="${i}"><span class="nm">${x.name}</span><span class="v">${x.overlays.length} scenes</span></button>`).join("")||'<p class="empty">No views yet.</p>'}</div>`,`<button class="mini" id="vadd">Add</button>`)+(v?`<div class="pg-col">`+pane(v.name,`<div class="pg-frm"><label for="vn">Name</label><input class="pg-input" id="vn" value="${v.name}"></div>`,`<button class="mini primary" id="vapply">Apply</button><button class="mini" id="vdel">Delete</button>`)+pane("Overlay scenes",`<div class="body"><table class="rows"><thead><tr><th>Scene</th><th class="r">Alpha</th><th>Speed</th><th></th></tr></thead><tbody>${o.map(i=>{const s=scene(i);return `<tr><td>${s?s.name:"Unknown"}</td><td class="r mono">${s?s.master:""}</td><td>${s?sp(s.speed):""}</td><td class="r"><button class="mini" data-vrm="${i}">Remove</button></td></tr>`}).join("")||'<tr><td class="dim">No overlay scenes.</td></tr>'}</tbody></table></div>`,addSel("vaddo",o),"pg-grow")+`</div>`:pane("View",'<p class="empty">Select or add a view.</p>'))+`</div>`;},
performance(){const o=ovs();return `<div class="pg pg-perf"><div class="pg-col">${S.live?'<div class="pg-banner">Exclusive preview. Overlays are suppressed until it is turned off.</div>':""}`+pane("Overlays",`<div class="pg-strips">${o.map(i=>{const s=scene(i);return `<div class="pg-strip"><b title="${s.name}">${s.name}</b>${fader(s.name,s.master,100,"Intensity","s"+i)}${speedKnob(i,s.speed)}<div class="pg-btns"><button class="mini" data-rst="${i}">Reset</button><button class="mini" data-off="${i}">Off</button><button class="mini" data-rmo="${i}">Remove</button></div></div>`}).join("")}</div>`,`<button class="mini ${S.live?"primary":""}" id="plive">Exclusive preview</button>`,"pg-grow")+`</div>`+pane("Scenes",`<div class="body">${P.scenes.map((s,i)=>({s,i})).filter(x=>!o.includes(x.i)).map(x=>`<button class="li" data-addov="${x.i}"><span class="nm">${x.s.name}</span><span class="v">Add</span></button>`).join("")||'<p class="empty">Every scene is already an overlay.</p>'}</div>`)+pane("Grand master",`<div class="pg-gm">${fader("Grand master",S.gm,100,"Master","GM")}<div class="pg-gm-b"><button class="mini" id="gr">Reset</button><button class="mini pg-black" id="gb" aria-pressed="${S.gm===0}">Blackout</button></div></div>`)+`</div>`;},
graph(){const g=S.graphSample,nodes=g?[["WHITE",80,70],["STATIC",340,70],["FOG-ON",340,230]]:[],sel=nodes[S.node];
 return `<div class="pg pg-graph">`+pane("Graphs",`<div class="body">${g?'<button class="li on"><span class="nm">Sample graph</span></button>':`<p class="empty">This show has no graphs.</p>`}</div><div class="pg-note"><button class="mini" id="gs">${g?"Hide sample":"Show a sample graph"}</button></div>`,`<button class="mini">Create</button>`)+
 pane(g?"Sample graph":"Scene graph",g?`<div class="pg-wrap"><svg class="pg-canvas" viewBox="0 0 640 420" aria-label="Scene graph"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6z" fill="currentColor"/></marker></defs><path class="pg-edge" d="M220 95H340" marker-end="url(#ar)"/><text class="pg-el" x="240" y="87">After Beats</text><path class="pg-edge" d="M410 120V230" marker-end="url(#ar)"/><text class="pg-el" x="416" y="178">On Enter Drop</text><path class="pg-edge" d="M340 255H150V120" marker-end="url(#ar)"/><text class="pg-el" x="170" y="272">Manual</text>${nodes.map((n,i)=>`<rect class="pg-node ${i===S.node?"on":""}" data-node="${i}" x="${n[1]}" y="${n[2]}" width="140" height="50"/><text class="pg-gt" x="${n[1]+10}" y="${n[2]+22}">${n[0]}</text><text class="pg-gs" x="${n[1]+10}" y="${n[2]+39}">${i===0?"Start":"Scene"}</text>`).join("")}</svg></div>`:`<div class="pg-wrap"><div class="well" style="margin:0">Create a graph to chain scenes together, moving between them manually, after a time, or on beat events.</div></div>`,g?`<label class="pg-tag"><input type="checkbox" checked> Enabled</label><button class="mini">Add node</button><button class="mini">Auto layout</button><span class="pg-tag">Zoom 100%</span><button class="mini">Delete graph</button>`:"")+
 pane(sel?sel[0]:"Node",sel?`<div class="pg-frm"><label>Name</label><input class="pg-input" value="${sel[0]}" aria-label="Name"><label>Alpha</label><span class="mono">100</span><label>Speed</label><span>1x</span></div><div class="pg-note"><div class="acts"><button class="mini">Set as start</button><button class="mini">Delete node</button></div></div><h4 class="subhead" style="padding:0 8px">Outgoing edge</h4><div class="pg-frm"><label>Condition</label><select aria-label="Condition">${["Manual","After Duration","After Beats","On Beat Drop","On Non-Beat","On Enter Drop","On Enter Breakdown"].map((c,i)=>`<option ${i===2?"selected":""}>${c}</option>`).join("")}</select></div>`:`<p class="empty">Select a node to edit it.</p>`)+`</div>`;},
visualizer(){const f=S.fx!==null?P.fixtures[S.fx]:null,seg=(a,c)=>`<span class="seg">${a.map(x=>`<button class="mini ${c===x?"primary":""}" data-${a===MODES?"mode":a===TOOLS?"tool":"cam"}="${x}">${x}</button>`).join("")}</span>`;
 return `<div class="pg pg-vis"><div class="pg-bar">${seg(MODES,S.mode)}${S.mode==="Edit"?seg(TOOLS,S.tool)+'<label><input type="checkbox" checked> Snap</label><button class="mini">Add</button><button class="mini">Undo</button><button class="mini">Redo</button>':""}${Object.keys(S.opts).map(k=>`<label><input type="checkbox" data-opt="${k}" ${S.opts[k]?"checked":""}> ${k}</label>`).join("")}<span class="pg-r"><button class="mini">Top</button> <button class="mini">Fit view</button> <button class="mini">Reset cam</button></span></div>`+pane("Stage, top view",`<div class="pg-wrap">${plan()}</div>`,`<span class="pg-tag">2D stand-in for the 3D view, using saved positions</span>`)+
 `<div class="pg-col">`+pane(f?f.name:"Selection",f?`<div class="pg-frm"><label>Group</label><span>${f.group}</span><label>Type</label><span>${f.type}</span><label>Position</label><span class="mono">${f.x}, ${f.y}, ${f.z}</span></div>`:`<p class="empty">Nothing selected.</p>`)+pane("Stage",`<div class="pg-frm"><label>Width</label><span>${P.room.width} m</span><label>Depth</label><span>${P.room.depth} m</span><label>Height</label><span>${P.room.height} m</span><label>Objects</label><span>${P.objects}</span></div>`,"","pg-grow")+`</div></div>`;},
};
const MODES=["View","Edit"],TOOLS=["Select","Move","Rotate","Scale"];
const addSel=(id,o)=>{const a=P.scenes.filter(s=>!o.includes(s.id));return a.length?`<select class="pg-input" id="${id}" aria-label="Add overlay scene"><option value="">Add overlay</option>${a.map(s=>`<option value="${s.id}">${s.name}</option>`).join("")}</select>`:'<span class="pg-tag">No more scenes to add</span>';};
const esc=x=>x.replace(/&/g,"&amp;").replace(/</g,"&lt;"),hl=x=>{const e=esc(x);if(!L.q)return e;const q=esc(L.q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return e.replace(new RegExp(q,"gi"),m=>`<mark>${m}</mark>`);};
const logFilter=()=>logs.filter(l=>L.lv.has(l[1])&&(!L.src||l[2]===L.src)&&l.join(" ").toLowerCase().includes(L.q.toLowerCase()));
const LVI={WARN:'<i class="ph-fill ph-warning"></i>',ERROR:'<i class="ph-fill ph-x-circle"></i>',INFO:'<i class="ph ph-info"></i>',DEBUG:'<i class="ph ph-bug"></i>'};
const logRows=r=>r.map(l=>{const i=logs.indexOf(l);return `<tr class="${l[1]} ${L.sel===i?"sl":""}" data-lr="${i}"><td class="t">${l[0].slice(0,8)}<span>${l[0].slice(8)}</span></td><td class="l">${LVI[l[1]]}${l[1]}</td><td class="s"><span>${l[2]}</span></td><td class="m">${hl(l[3])}</td></tr>`;}).join("")||'<tr class="none"><td colspan="4">No log lines match the filter.</td></tr>';
const pl=(n,w)=>`${n} ${w}${n===1?"":"s"}`,logFoot=r=>`<span>${r.length} of ${logs.length} lines</span><span class="lg-dot WARN">${pl(r.filter(l=>l[1]==="WARN").length,"warning")}</span><span class="lg-dot ERROR">${pl(r.filter(l=>l[1]==="ERROR").length,"error")}</span><span class="lg-live ${L.auto?"on":""}">${L.auto?"Following":"Paused"}</span>`;
function plan(){const w=P.room.width,d=P.room.depth,sc=20,W=w*sc,D=d*sc,x=v=>(v+w/2)*sc,z=v=>(v+d/2)*sc;let h=`<svg class="pg-canvas" viewBox="-30 -20 ${W+60} ${D+40}" preserveAspectRatio="xMidYMid meet" aria-label="Stage plan">`;
 if(S.opts.Room)h+=`<rect class="pg-room" width="${W}" height="${D}"/>`;
 if(S.opts.Grid)for(let i=0;i<=w;i++)h+=`<line class="pg-gridl" x1="${i*sc}" x2="${i*sc}" y2="${D}"/>`;
 if(S.opts.Grid)for(let i=0;i<=d;i++)h+=`<line class="pg-gridl" y1="${i*sc}" y2="${i*sc}" x2="${W}"/>`;
 if(S.opts.Axes)h+=`<line x1="${x(0)}" x2="${x(2)}" y1="${z(0)}" y2="${z(0)}" stroke="#d55"/><line x1="${x(0)}" x2="${x(0)}" y1="${z(0)}" y2="${z(2)}" stroke="#5a5"/>`;
 P.fixtures.forEach((f,i)=>{if(S.opts.Beams)h+=`<line class="pg-beam" x1="${x(f.x)}" y1="${z(f.z)}" x2="${x(f.x)}" y2="${z(f.z)+14}"/>`;if(S.opts.Bodies)h+=`<rect class="pg-fx ${i===S.fx?"sl":""}" data-fxi="${i}" x="${x(f.x)-4}" y="${z(f.z)-4}" width="8" height="8"><title>${f.name}</title></rect>`;if(S.opts.Labels)h+=`<text class="pg-lb" x="${x(f.x)+6}" y="${z(f.z)+3}">${f.name}</text>`;});
 return h+"</svg>";}
var draw=function(){nav();$("content").innerHTML=V[page()]();};
document.addEventListener("click",e=>{if(!e.target.closest("#content"))return;const c=s=>e.target.closest(s),t=e.target,o=ovs(),d=(q)=>c(`[data-${q}]`)?.dataset[q];
 if(c("#llv")){const t=c("#llv"),LV=[["DEBUG","Debug"],["INFO","Info"],["WARN","Warn"],["ERROR","Error"]];BL.dropdown(t,{multi:true,value:L.lv,items:LV.map(([l,n])=>({value:l,label:n,icon:LVI[l],meta:logs.filter(x=>x[1]===l).length,cls:"lg-"+l})),onChange:v=>{L.lv=v;const b=$("llv"),r=logFilter();$("lt").innerHTML=logRows(r);$("lf").innerHTML=logFoot(r);b.childNodes[1].textContent=v.size===4?"All levels":v.size?LV.filter(([l])=>v.has(l)).map(([,n])=>n).join(", "):"No levels";}});return;}if(t.id==="la"){L.auto=!L.auto;return draw();}if(t.id==="lc"){logs=[];L.sel=null;return draw();}if(d("lr")!==undefined){L.sel=L.sel===+d("lr")?null:+d("lr");return draw();}
 if(d("view")!==undefined){S.view=+d("view");return draw();}if(t.id==="vadd"){P.views.push({id:Date.now(),name:(()=>{let n=1,x="New view";while(P.views.some(v=>v.name===x))x="New view "+ ++n;return x})(),overlays:[]});S.view=P.views.length-1;return draw();}if(t.id==="vdel"){P.views.splice(S.view,1);S.view=0;return draw();}if(d("vrm")!==undefined){const v=P.views[S.view];v.overlays=v.overlays.filter(x=>x!==+d("vrm"));return draw();}if(t.id==="vapply"){S.overlays=[...P.views[S.view].overlays];location.hash="performance";return;}
 if(d("rst")!==undefined){const s=scene(+d("rst"));s.master=100;s.speed="_1";return draw();}if(d("off")!==undefined){scene(+d("off")).master=0;return draw();}if(d("rmo")!==undefined){S.overlays=o.filter(x=>x!==+d("rmo"));return draw();}if(t.id==="plive"){S.live=!S.live;return draw();}if(c("#gr")){BL.setGm(100);return;}if(t.id==="gb"){BL.toggleBlack();return;}
 if(t.id==="gs"){S.graphSample=!S.graphSample;return draw();}if(d("node")!==undefined){S.node=+d("node");return draw();}

document.addEventListener("pointerdown",e=>{const tr=e.target.closest(".track");if(!tr)return;tr.setPointerCapture(e.pointerId);const max=+tr.dataset.max,name=tr.parentElement.dataset.name;const set=ev=>{const r=tr.getBoundingClientRect(),v=Math.max(0,Math.min(1,(r.bottom-18-ev.clientY)/(r.height-36)));tr.style.setProperty("--v",v*100);const val=Math.round(v*max);tr.parentElement.querySelector(".val").textContent=val;if(name==="GM")S.gm=val;if(name[0]==="s"&&scene(+name.slice(1)))scene(+name.slice(1)).master=val;};set(e);tr.onpointermove=set;tr.onpointerup=()=>tr.onpointermove=null;});
