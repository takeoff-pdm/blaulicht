<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><title>Scene picker options</title><link rel="stylesheet" href="studio.css">
<style>html,body{height:auto;overflow:auto}body{padding:16px;background:var(--gutter);color:var(--text)}h1{font-size:18px;font-weight:500;color:var(--strong)}p.i{margin:4px 0 12px;max-width:80ch}
.vs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,720px),1fr));gap:14px}.v b{display:block;font-weight:500;color:var(--strong);margin-bottom:2px}.v p{margin:0 0 6px;color:var(--muted);max-width:80ch}
.fr{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#000}.fr iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0}
.v a{color:var(--blue);font-size:12px}.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}</style></head>
<body><h1>Scene picker, opened</h1>
<p class="i">Only the open picker differs. Each frame is the real draft page at 1440x900, with the picker opened on load. Click inside a frame to try it, or open it full size. Pick by code, like A2.</p>
<div class="bar"><button class="mini" id="t">Switch to light theme</button></div>
<div class="vs" id="vs"></div>
<script>
const V=[["A1","flat","Flat popover (current)","Same surfaces as the panes behind it, separated by one thin line, so it blends into the Groups list."],
["A2","raised","Raised popover","Lighter surface, lighter edge and a soft shadow, attached to the open button. Quick to pick and close; needs a shadow exception to the rules."],
["A3","dim","Dimmed page","Current popover with the page darkened behind it. Strongest focus, but picking a scene feels like opening a dialog."],
["A4","drawer","Drawer over the lists","The scene list covers Groups and Fixtures at full height, like a list pane. Lots of room for big shows, but hides what you select from."]];
let theme="dark";
const draw=()=>{document.getElementById("vs").innerHTML=V.map(([c,k,n,d])=>{const u=`programmer-scene.html?picker=${k}&open=1#${theme}`;return `<div class="v"><b>${c} ${n}</b><p>${d}</p><div class="fr"><iframe src="${u}" title="${c} ${n}"></iframe></div><a href="${u}" target="_blank">Open ${c} full size</a></div>`}).join("");fit();};
const fit=()=>document.querySelectorAll(".fr").forEach(f=>f.querySelector("iframe").style.transform=`scale(${f.clientWidth/1440})`);
addEventListener("resize",fit);
document.getElementById("t").onclick=e=>{theme=theme==="dark"?"light":"dark";document.documentElement.dataset.theme=theme;e.target.textContent=theme==="dark"?"Switch to light theme":"Switch to dark theme";draw();};
draw();
</script></body></html>
