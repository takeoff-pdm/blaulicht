<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Blaulicht Setup draft</title>
<link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="system.css"><link rel="stylesheet" href="setup.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script></head><body>
<div class="shell"><nav class="nav" id="nav"></nav><main class="syswork"><div id="content"></div></main>
<footer class="status"></footer><script src="chrome.js"></script></div>
<script src="setupdata.js"></script>
<script src="treedrag.js"></script>
<script>
const $=i=>document.getElementById(i),S=window.SETUP;
const TABS=[["fixtures","Fixtures"],["groups","Groups"],["scenes","Scenes"],["animations","Animations"],["palettes","Palettes"]];
const SYS=[["general","General"],["dmx","DMX & Art-Net"],["plugins","Plugins"],["devices","MIDI & Serial"],["screens","Screens"],["remote","Remote UI"]];
const ICON={Logs:"terminal-window",Audio:"waveform","Views":"stack","Perform":"game-controller",Programmer:"faders","Scene Graph":"graph",Visualizer:"cube-focus"};
const tab=()=>TABS.find(t=>"#"+t[0]===location.hash)?.[0]||"fixtures";
const it=n=>`<button class="link" data-page="${n}"><i class="ph ph-${ICON[n]}"></i>${n}</button>`;
function drawNav(){const c=tab();$("nav").innerHTML=`<div class="logo"><img src="logo_blaulicht.svg" alt="blaulicht"><button class="fold" aria-label="Collapse the sidebar"><i class="ph ph-caret-double-left"></i></button></div><h2>System</h2>${it("Logs")}<button class="link" data-sys="general"><i class="ph ph-gear"></i>System</button>${SYS.map(([k,n])=>`<button class="sub link" data-sys="${k}">${n}</button>`).join("")}<h2>Setup</h2>${it("Audio")}<button class="link" data-tab="fixtures"><i class="ph ph-wrench" style="color:var(--blue)"></i>Setup</button>${TABS.map(([k,n])=>`<button class="sub link ${k===c?"on":""}" data-tab="${k}">${n}</button>`).join("")}<h2>Live</h2>${it("Views")}${it("Perform")}${it("Programmer")}${it("Scene Graph")}${it("Visualizer")}`;}
$("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab)location.hash=b.dataset.tab;if(b.dataset.sys)location.href="system.html#"+b.dataset.sys;if(b.dataset.page==="Programmer")location.href="programmer.html";else{const pg={Logs:"logs",Audio:"audio","Views":"views","Perform":"performance","Scene Graph":"graph",Visualizer:"visualizer"}[b.dataset.page];if(pg)location.href="pages.html#"+pg;}if(b.dataset.tab==="animations")location.href="animation-editor.html";};
const pretty={AdjMegaHexPar:"ADJ Mega Hex Par",DimmerSingle:"Dimmer",LiteCraftMiniParAT10:"LiteCraft AT10",MartinMac250E:"Martin MAC 250E",VaryTechVP1:"Varytec VP1",FogMachineSingle:"Fog machine"};
const pre=(l,n)=>`<span class="hpre">${l}:</span>${n}`;
const pane=(t,b,r="",cls="")=>`<section class="pane ${cls}"><header>${t}${r?`<span class="hr">${r}</span>`:""}</header>${b}</section>`;
const st={group:3,fx:null,fxs:new Set(),gsel:3,scene:1,anim:0,pal:0,folded:new Set(),confirm:null,dirty:false};
const allFx=()=>S.groups.flatMap(g=>g.fixtures.map(f=>({...f,g})));
const rng=(a,n)=>n>1?`${a}-${a+n-1}`:`${a}`;
function clashes(f,g){return allFx().filter(o=>!(o.id===f.id&&o.g===g)&&o.u===f.u&&f.a<o.a+o.n&&o.a<f.a+f.n);}
const tree=(kind,items,key,cur,right)=>{let h="";const row=i=>`<button class="row leaf ${i.id===cur?"on":""}" data-pick="${key}:${i.id}">${i.name}<span class="v ${key==="scene"?"sid":""}">${right(i)}</span></button>`;S.folders.filter(f=>f.kind===kind).forEach(f=>{const k=items.filter(i=>i.folder===f.id),o=!st.folded.has(f.id);h+=`<button class="row folder" data-fold="${f.id}"><i class="ph-bold ph-caret-${o?"down":"right"}"></i><i class="ph-fill ph-folder${o?"-open":""} fic"></i>${f.name}<span class="v num">${o?"":k.length}</span></button>`;if(o)h+=k.map(row).join("")});return h+items.filter(i=>i.folder==null).map(row).join("");};
const groupTree=(key,cur)=>tree("Groups",S.groups,key,cur,g=>g.fixtures.length);
const del=(k)=>st.confirm===k?`<button class="mini confirm" data-del="${k}">${k==="fx"&&st.fxs.size>1?`Delete ${st.fxs.size} fixtures`:"Confirm delete"}</button><button class="mini" data-cancel>Cancel</button>`:`<button class="mini" data-ask="${k}">Delete</button>`;
const V={
fixtures(){if(st.fx!=null&&!st.fxs.size)st.fxs.add(st.fx);const g=S.groups.find(x=>x.id===st.group)||S.groups[0],sel=g.fixtures.filter(x=>st.fxs.has(x.id)),f=sel.length===1?sel[0]:null;
 return `<div class="tri">`+pane("Groups",`<div class="body">${groupTree("group",g.id)}</div>`)+
 pane(pre("Selected group",g.name),`<div class="fxfilter"><input data-filter="sfx" placeholder="Filter fixtures" aria-label="Filter fixtures"></div><div class="body"><table class="rows"><thead><tr><th>Fixture</th><th>Type</th><th>Universe</th><th>Channels</th><th class="r">Ch</th></tr></thead><tbody>${g.fixtures.map(x=>`<tr class="sl ${st.fxs.has(x.id)?"on":""} ${st.identFx===x.id?"ident":""} ${clashes(x,g).length?"warn":""}" data-fx="${x.id}"><td>${clashes(x,g).length?'<i class="ph-bold ph-warning"></i> ':""}${x.name}</td><td class="dim">${pretty[x.type]}</td><td class="mono">${x.u}</td><td class="mono">${rng(x.a,x.n)}</td><td class="r dim">${x.n}</td></tr>`).join("")}</tbody></table></div>`,`<span class="mono">${g.fixtures.length}</span><button class="mini">Add fixture</button><button class="mini">Overrides</button><button class="mini">Simulate</button>`)+
 pane(f?pre("Fixture",f.name):sel.length?pre("Fixtures",`${sel.length} selected`):"Fixture",f?editor(f,g):sel.length?multiEditor(sel):`<p class="empty">Select a fixture to edit it, or add a new one. Ctrl or Cmd+click selects several, Shift+click a range.</p>`,sel.length?`<button class="mini" data-movefx>Move to group</button><i class="hsep"></i>${del("fx")}`:"")+`</div>`;},
groups(){const g=S.groups.find(x=>x.id===st.gsel)||S.groups[0],types={};g.fixtures.forEach(f=>types[f.type]=(types[f.type]||0)+1);const ch=g.fixtures.reduce((a,f)=>a+f.n,0);
 return `<div class="duo">`+pane("Groups",`<div class="body">${groupTree("gsel",g.id)}</div>`,`<button class="mini">Add</button><button class="mini">Folder</button>`)+`<div class="mdright">`+
 pane(pre("Group",g.name),`<div class="frm"><label for="gn">Name</label><input id="gn" data-edit="gname" value="${g.name}"><label>Contains</label><span>${g.fixtures.length} fixtures, ${ch} channels</span><label>Types</label><span>${Object.entries(types).map(([k,v])=>`${v} ${pretty[k]}`).join(", ")}</span></div>`,`<button class="mini" data-edfx="${g.id}">Edit fixtures</button><button class="mini">Show in Visualizer</button>${del("group")}`)+
 pane("Fixtures",`<div class="body"><table class="rows"><thead><tr><th>Fixture</th><th>Type</th><th>Universe</th><th>Channels</th></tr></thead><tbody>${g.fixtures.map(x=>`<tr><td>${x.name}</td><td class="dim">${pretty[x.type]}</td><td class="mono">${x.u}</td><td class="mono">${rng(x.a,x.n)}</td></tr>`).join("")}</tbody></table></div>`,"","grow")+`</div></div>`;},
scenes(){const s=S.scenes.find(x=>x.id===st.scene)||S.scenes[0];
 return `<div class="duo">`+pane("Scenes",`<div class="body">${tree("Scenes",S.scenes,"scene",s.id,x=>"#"+x.id)}</div>`,`<button class="mini">Add</button><button class="mini">Folder</button>`)+`<div class="mdright">`+
 pane(pre("Scene",s.name),`<div class="frm"><label for="sn">Name</label><input id="sn" data-edit="sname" value="${s.name}"></div>`,`<button class="mini">Clone</button><button class="mini" data-prog>Open in Programmer</button>${S.scenes.length>1?del("scene"):""}`)+
 pane("Contents",`<table class="rows"><tr><td>Scene changes</td><td class="r mono">${s.changes}</td></tr><tr><td>Active animations</td><td class="r mono">${s.anims}</td></tr><tr><td>Fixtures with palettes</td><td class="r mono">${s.pals}</td></tr></table>`,"","grow")+`</div></div>`;},
animations(){const a=S.anims.find(x=>x.id===st.anim)||S.anims[0],k=Object.keys(a.body)[0],b=a.body[k];
 return `<div class="duo">`+pane("Animations",`<div class="body">${S.anims.map(x=>`<button class="li ${x===a?"on":""}" data-pick="anim:${x.id}"><span class="nm">${x.name}</span><span class="v">${x.prop}</span></button>`).join("")}</div>`,`<button class="mini">Add</button><button class="mini">Presets</button>`)+`<div class="mdright">`+
 pane(pre("Animation",a.name),`<div class="frm"><label for="an">Name</label><input id="an" data-edit="aname" value="${a.name}"><label>Property</label><span>${a.prop}</span><label>Kind</label><span>${({Phaser:"Phaser",FlashAnimation:"Flash",WasmPlugin:"Plugin"})[k]||k}</span></div>`,del("anim"))+
 pane("Shape",k==="WasmPlugin"?`<p class="empty">This animation is drawn by a plugin, so its shape isn't known here.</p>`:`<div class="pad2">${wave(k,b)}<dl class="kv">${params(k,b)}</dl><p class="note">Curve drawn from the saved settings in this mockup, not by the engine.</p></div>`,"","grow")+`</div></div>`;},
palettes(){const p=S.palettes.find(x=>x.id===st.pal)||S.palettes[0],k=Object.keys(p.kind)[0];
 return `<div class="duo">`+pane("Palettes",`<div class="body">${tree("Palettes",S.palettes,"pal",p.id,x=>Object.keys(x.kind)[0])}</div>`,`<button class="mini">Add</button><button class="mini">Folder</button>`)+`<div class="mdright">`+
 pane(pre("Palette",p.name),`<div class="frm"><label for="pn">Name</label><input id="pn" data-edit="pname" value="${p.name}"><label>Kind</label><span>${k}</span></div>`,del("pal"))+
 pane(k==="Pointer"?"Follows":"Value",palBody(p,k),"","grow")+`</div></div>`;},
};
function editor(f,g){const c=clashes(f,g),fits=f.a+f.n<=512,num=(k,v,l)=>`<input class="num" inputmode="numeric" data-f="${k}" data-min="0" data-max="${k==="u"?32767:511}" value="${v}" aria-label="${l}">`,tr=(o,k,L,u)=>["x","y","z"].map((a,i)=>`<label class="xyzc"><input class="num" data-v="${k}.${a}" data-step="${u==="m"?0.05:1}" value="${o[a]}" aria-label="${k==="pos"?"Position":"Rotation"} ${L[i]}${u==="m"?" in metres":" in degrees"}"><small>${L[i]}${u==="m"?", m":""}</small></label>`).join("");
 return `<div class="body"><div class="frm"><label for="fn">Name</label><input id="fn" data-f="name" value="${f.name}"><label>Type</label><span>${pretty[f.type]}, ${f.n} ${f.n===1?"channel":"channels"}</span><h4>Patch</h4><label>Universe</label>${num("u",f.u,"Universe")}<label>Start channel</label>${num("a",f.a,"Start channel")}<label>Channels</label><span class="mono" id="frng">${rng(f.a,f.n)}</span><div id="pmsg" class="msg ${c.length||!fits?"w":"o"}">${pmsg(f,g)}</div><div class="fxacts"><button class="mini livebtn" id="fxident" aria-pressed="false" title="Flash this fixture so you can find it on the rig">Identify</button><button class="mini livebtn" id="fxinit" aria-pressed="${st.finitKey===String(f.id)}" title="Send the fixture its start-up values, such as lamp on and reset">Initialize</button></div><h4>Position</h4><div class="fxplan" data-size="small">${plan(f)}</div><label>Position</label><div class="xyz">${tr(f.pos,"pos",["Across (X)","Height (Y)","Depth (Z)"],"m")}</div><label>Rotation</label><div class="xyz">${tr(f.rot,"rot",["X","Y","Z"],"°")}</div></div></div>`;}
function multiEditor(sel){const types=[...new Set(sel.map(x=>x.type))],dis=v=>`<input class="num" disabled value="--" aria-label="${v}, only for a single fixture">`,key=sel.map(x=>x.id).join(",");
 return `<div class="body"><div class="frm"><label>Fixtures</label><span>${sel.length} selected</span><label>Type</label><span>${types.length===1?pretty[types[0]]:"Mixed"}</span><h4>Patch</h4><label>Universe</label>${dis("Universe")}<label>Start channel</label>${dis("Start channel")}<label>Channels</label><span class="mono dim">--</span><div class="msg o">Universe and channels are set one fixture at a time.</div><div class="fxacts"><button class="mini livebtn" id="fxident" aria-pressed="false" title="Step through the selected fixtures and flash each one">Identify</button><button class="mini livebtn" id="fxinit" aria-pressed="${st.finitKey===key}" title="Send the selected fixtures their start-up values, such as lamp on and reset">Initialize</button></div><h4>Position</h4><p class="frz">Select one fixture to position it.</p><label>Position</label><div class="xyz">${dis("Across").repeat(3)}</div><label>Rotation</label><div class="xyz">${dis("Rotation").repeat(3)}</div></div></div>`;}
/* Moves fixtures between groups (Move to group, or dragging rows onto a group). */
window.moveFixtures=(ids,to)=>{const g=S.groups.find(x=>x.id===st.group),T=S.groups.find(x=>x.id===to);if(!g||!T||g===T)return;const mv=g.fixtures.filter(x=>ids.includes(x.id));if(!mv.length)return;
 g.fixtures=g.fixtures.filter(x=>!ids.includes(x.id));T.fixtures.push(...mv);st.fxs.clear();st.fx=null;st.confirm=null;draw();BL.dirty();BL.toast(`Moved ${mv.length===1?mv[0].name:mv.length+" fixtures"} to ${T.name}`);};
function pmsg(f,g){const c=clashes(f,g);if(f.a+f.n>512)return`Runs past channel 511, the last channel in this universe.`;return c.length?`Overlaps ${c.slice(0,3).map(o=>o.name).join(", ")}${c.length>3?` and ${c.length-3} more`:""}.`:"No conflicts on this universe.";}
function wave(k,b){let pts=[];for(let i=0;i<=200;i++){const t=i/200;let y;if(k==="Phaser"){const m=b.kind.Mathematical;y=m?.base==="Sin"||!m?(Math.sin(t*Math.PI*4)+1)/2:t*2%1;}else{const on=b.on_time_ms||100,off=b.off_time_ms||100,per=on+off,x=(t*2*per)%per;y=x<on?1:0;}pts.push(`${i},${(58-y*54).toFixed(1)}`);}return `<svg class="wave" viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="31" x2="200" y2="31"/><polyline points="${pts.join(" ")}"/></svg>`;}
function params(k,b){const lit=v=>v&&v.Literal!==undefined?v.Literal:"Set by palette";const tm=t=>t?t.Fixed!==undefined?t.Fixed+" ms":t.Beat?t.Beat.slice(1).replace("_","/")+" beats":"":"";if(k==="Phaser"){const m=b.kind.Mathematical||{};return `<dt>Curve</dt><dd>${m.base||Object.keys(b.kind)[0]}</dd><dt>Range</dt><dd>${lit(m.amplitude_min)} to ${lit(m.amplitude_max)}</dd><dt>Duration</dt><dd>${tm(b.time_total)}</dd><dt>Sync</dt><dd>${b.sync}</dd>`;}return `<dt>Range</dt><dd>${lit(b.amplitude_min)} to ${lit(b.amplitude_max)}</dd><dt>On</dt><dd>${b.on_time_ms} ms</dd><dt>Off</dt><dd>${b.off_time_ms} ms</dd><dt>Beat aligned</dt><dd>${b.beat_aligned?"Yes":"No"}</dd>`;}
function palBody(p,k){const v=p.kind[k];if(k==="Color"){const l=v.v*50*(2-v.s),sl=l===0||l===100?0:(v.v*100-l)/Math.min(l,100-l)*100;return `<div class="pad2"><div class="swatch" style="background:hsl(${v.h} ${sl}% ${l}%)"></div><div class="frm" style="padding:0"><label>Hue</label><input class="num" data-pv="h" value="${Math.round(v.h)}" aria-label="Hue"><label>Saturation</label><input class="num" data-pv="s" value="${Math.round(v.s*255)}" aria-label="Saturation"><label>Value</label><input class="num" data-pv="v" value="${Math.round(v.v*255)}" aria-label="Value"></div></div>`;}
 if(k==="Pointer"){const t=S.palettes.find(x=>x.id===v.target);return `<div class="pad2"><dl class="kv"><dt>Target</dt><dd><button class="mini" data-pick="pal:${v.target}">${t?t.name:"Missing"}</button></dd><dt>Applies to</dt><dd>${v.property||"All properties"}</dd><dt>Steps</dt><dd>${v.ops.length?v.ops.map(o=>typeof o==="string"?o:Object.keys(o)[0]).join(", "):"None, passes the value through"}</dd></dl></div>`;}return `<pre class="empty">${JSON.stringify(v)}</pre>`;}
function draw(){drawNav();$("content").innerHTML=V[tab()]();}
document.addEventListener("click",e=>{const c=s=>e.target.closest(s),p=c("[data-pick]"),f=c("[data-fold]"),x=c("[data-fx]"),a=c("[data-ask]"),d=c("[data-del]"),ed=c("[data-edfx]");
 if(!e.target.closest("#content"))return;
 if(p){const[k,v]=p.dataset.pick.split(":");st[k]=+v;if(k==="group"){st.fx=null;st.fxs.clear();}st.confirm=null;return draw();}
 if(f){const i=+f.dataset.fold;st.folded.has(i)?st.folded.delete(i):st.folded.add(i);return draw();}
 if(x){const id=+x.dataset.fx,g=S.groups.find(q=>q.id===st.group),ids=g.fixtures.map(q=>q.id);
  if(e.shiftKey&&st.fx!=null&&ids.includes(st.fx)){const [a,b]=[ids.indexOf(st.fx),ids.indexOf(id)].sort((m,n)=>m-n);if(!(e.metaKey||e.ctrlKey))st.fxs.clear();ids.slice(a,b+1).forEach(q=>st.fxs.add(q));}
  else if(e.metaKey||e.ctrlKey){st.fxs.has(id)?st.fxs.delete(id):st.fxs.add(id);st.fx=st.fxs.has(id)?id:[...st.fxs].pop()??null;}
  else{st.fxs=new Set([id]);st.fx=id;}
  st.confirm=null;return draw();}
 if(c("[data-movefx]")){const g=S.groups.find(q=>q.id===st.group),F=Object.fromEntries(S.folders.map(q=>[q.id,q.name]));BL.dropdown(c("[data-movefx]"),{items:S.groups.filter(q=>q!==g).map(q=>({value:q.id,label:q.name,group:q.folder==null?"No folder":F[q.folder],meta:q.fixtures.length})).sort((m,n)=>String(m.group).localeCompare(n.group)),value:null,placeholder:"Filter groups",width:220,onChange:v=>moveFixtures([...st.fxs],v)});return;}
 if(ed){st.group=+ed.dataset.edfx;st.fx=null;location.hash="fixtures";return;}
 if(c("[data-prog]")){location.href="programmer.html";return;}
 if(a){st.confirm=a.dataset.ask;return draw();}
 if(c("[data-cancel]")){st.confirm=null;return draw();}
 if(d){const k=d.dataset.del;if(k==="fx"){const g=S.groups.find(x=>x.id===st.group);g.fixtures=g.fixtures.filter(x=>!st.fxs.has(x.id));st.fx=null;st.fxs.clear();}if(k==="group"){S.groups=S.groups.filter(x=>x.id!==st.gsel);st.gsel=S.groups[0]?.id;}if(k==="scene"){S.scenes=S.scenes.filter(x=>x.id!==st.scene);st.scene=S.scenes[0].id;}if(k==="anim"){S.anims=S.anims.filter(x=>x.id!==st.anim);st.anim=S.anims[0]?.id;}if(k==="pal"){S.palettes=S.palettes.filter(x=>x.id!==st.pal);st.pal=S.palettes[0]?.id;}st.confirm=null;dirty();return draw();}
});
const dirty=()=>BL.dirty();
$("content").addEventListener("input",e=>{const t=e.target,g=S.groups.find(x=>x.id===st.group),f=g&&g.fixtures.find(x=>x.id===st.fx);dirty();
 if(t.dataset.f&&f){const k=t.dataset.f;const lim={u:32767,a:511}[k];if(k==="name"?!t.value.trim():lim!==undefined&&(!/^\d+$/.test(t.value)||+t.value>lim)){t.classList.add("bad");return;}t.classList.remove("bad");f[k]=k==="name"?t.value:+t.value;if(k!=="name"){$("frng").textContent=rng(f.a,f.n);const m=$("pmsg");m.textContent=pmsg(f,g);m.className="msg "+(clashes(f,g).length||f.a+f.n>512?"w":"o");}}
 if(t.dataset.edit==="gname"){S.groups.find(x=>x.id===st.gsel).name=t.value;}if(t.dataset.edit==="sname"){S.scenes.find(x=>x.id===st.scene).name=t.value;}if(t.dataset.edit==="aname"){S.anims.find(x=>x.id===st.anim).name=t.value;}if(t.dataset.edit==="pname"){S.palettes.find(x=>x.id===st.pal).name=t.value;}});
$("content").addEventListener("change",e=>{if(e.target.matches("[data-f],[data-edit]"))draw();});
$("theme").onclick=e=>{const l=document.documentElement.dataset.theme!=="light";document.documentElement.dataset.theme=l?"light":"dark";e.target.textContent=l?"Dark theme":"Light theme";};
addEventListener("hashchange",draw);draw();

BL.groups=()=>S.groups.map(g=>g.name);
BL.onAddFixture=({name,group,u,a,n})=>{const g=S.groups.find(x=>x.name===group);if(!g)return;const base=(g.fixtures[0]||S.groups.find(x=>x.fixtures.length).fixtures[0]),id=Math.max(0,...allFx().map(x=>x.id))+1;g.fixtures.push({...JSON.parse(JSON.stringify(base)),id,name,u,a:a-1,n});st.group=g.id;st.fx=id;draw();};
const EMPTY={groups:"No groups yet. Use Add to create one.",scenes:"No scenes yet. Use Add to create one.",palettes:"No palettes yet. Use Add to create one.",fixtures:"No fixtures yet. Use Add fixture."};
Object.keys(EMPTY).forEach(k=>{const o=V[k];V[k]=()=>{try{return o()}catch{return `<div class="plan"><section class="pane"><header>${k[0].toUpperCase()+k.slice(1)}</header><p class="empty">${EMPTY[k]}</p></section></div>`}}});
document.addEventListener("click",e=>{const b=e.target.closest('[data-del="pal"]');if(!b)return;if(b.dataset.ok){delete b.dataset.ok;return;}const deps=S.palettes.filter(x=>x.kind.Pointer&&x.kind.Pointer.target===st.pal);if(!deps.length)return;e.stopPropagation();BL.dialog("Delete this palette?",`<p class="warnt"><i class="ph ph-warning"></i> These palettes follow it and will stop working:</p><p>${deps.map(x=>x.name).join(", ")}</p>`,[["Cancel"],["Delete palette","red-text",()=>{b.dataset.ok="1";b.click();}]]);},true);

/* Patch numbers apply as a whole when you leave the field, so a half-typed value never moves a fixture. */
let commitF=false;
addEventListener("input",e=>{const t=e.target;if(commitF||!t.dataset||!t.dataset.f||t.dataset.f==="name"||!["u","a"].includes(t.dataset.f))return;e.stopImmediatePropagation();t.classList.toggle("pend",true);t.classList.remove("bad");},true);
