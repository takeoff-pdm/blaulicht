<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Patch References</title>
<link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="system.css">
<style>
body{overflow:auto}.wrap{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr;background:var(--pane)}
.tabs{display:flex;gap:2px;padding:6px;background:var(--head)}.tabs button{height:26px;padding:0 12px;background:var(--ctl)}.tabs button.on{background:var(--blue-dim);color:var(--strong)}
.capt{padding:10px 12px;border-bottom:2px solid var(--gutter);max-width:90ch}.capt h1{font-size:15px;color:var(--strong);font-weight:600}.capt p{color:var(--muted);font-size:12px;margin-top:3px}.capt a{color:var(--blue)}
.pg{padding:10px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}.tb{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.sheet{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:1px}.sq{height:50px;background:var(--well);padding:2px 3px;font-size:10px;line-height:12px;overflow:hidden;color:var(--muted)}.sq b{display:block;font:12px PlexMono,monospace;color:var(--strong)}.sq.alt{background:color-mix(in srgb,var(--blue) 18%,var(--well))}.sq.x{background:var(--red);color:#fff}.sq.x b{color:#fff}
.t{border-collapse:collapse;width:100%}.t th{text-align:left;font-weight:400;color:var(--muted);font-size:12px;padding:3px 8px;border-bottom:1px solid var(--line)}.t td{padding:3px 8px;font-size:12px;white-space:nowrap}.t .red{color:var(--red)}.t .org{color:var(--warn)}.t tr.redbg td{background:color-mix(in srgb,var(--red) 35%,transparent)}
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}.ut{background:var(--well);padding:6px}.ut b{color:var(--strong)}.dots{display:grid;grid-template-columns:repeat(32,1fr);gap:1px;margin-top:5px}.dots i{aspect-ratio:1;background:transparent}.dots i.u{background:#fff;border-radius:50%}
.chart{display:grid;grid-template-columns:repeat(512,1fr);height:110px;align-items:end;background:var(--well);padding:2px;gap:0}.chart i{background:var(--ok);display:block}
.two{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:12px}.ag{display:grid;grid-template-columns:repeat(16,1fr);gap:1px}.ag i{font:9px/16px PlexMono,monospace;text-align:center;background:var(--well);color:var(--muted);font-style:normal}.ag i.u{background:var(--blue-dim);color:var(--strong)}
.amap{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:1px}.amap i{font:10px/18px PlexMono,monospace;text-align:center;background:var(--well);color:var(--muted);font-style:normal;overflow:hidden}.amap i.u{color:#000;background:#d9d9c7}.amap i.x{background:var(--red);color:#fff}
</style></head><body><div class="wrap"><div class="tabs" id="tabs"></div><div class="capt" id="cap"></div><div class="pg" id="pg"></div></div>
<script src="sysdata.js"></script>
<script>
const $=i=>document.getElementById(i),M=window.META,P=M.patch.filter(p=>p.u===0).sort((a,b)=>a.a-b.a);
const map=Array(512).fill(null);P.forEach(p=>{for(let c=p.a;c<p.a+p.n&&c<512;c++)(map[c]=map[c]||[]).push(p)});
const val=c=>Math.round((Math.sin(c*.37)+1)/2*((c*7)%5?255:40));let fmt=0,inputs=false,view="dmx";
const PAGES={
ma:["grandMA3 DMX sheet + patch","One square per channel with its value, attribute and fixture, showing final output. A separate patch list marks problems with orange and red text.",[["DMX sheet manual","https://help2.malighting.com/Page/grandMA3/dmx_sheet/en/1.1"],["Conflicts in the patch","https://help.malighting.com/grandMA3/2.2/HTML/ft_conflicts_in_fixture_types.html"]],()=>`<div class="tb"><button class="mini" data-f>Address: ${fmt?"Absolute":"Universe.Channel"}</button></div>
<div class="sheet">${map.slice(0,120).map((o,c)=>`<div class="sq ${o&&o.length>1?"x":o&&(P.indexOf(o[0])%2)?"alt":""}">${fmt?c:"1."+c}<b>${o?val(c):""}</b>${o?o[0].name:""}</div>`).join("")}</div>
<table class="t"><tr><th>Fixture</th><th>Patch</th><th>Note</th></tr>${P.filter(p=>map[p.a].length>1).map(p=>`<tr class="red"><td>${p.name}</td><td>1.${p.a}</td><td>Error: DMX channel overlapped. Show Conflicts explains why.</td></tr>`).join("")}</table>`],
dot:["dot2 universe overview","Each universe is a tile with dots for assigned addresses, so an empty tile means a free universe. When choosing an address, fixtures that don't fit are marked with a red background.",[["Select DMX address window","https://help.malighting.com/dot2/en/help/key_window_selectdmxaddress.html"],["Universe table","https://help2.malighting.com/Topic/bfc8868e-9fe1-4364-be83-5f81994da9e8"]],()=>`<div class="ov">${Array.from({length:10},(_,u)=>{const f=M.patch.filter(p=>p.u===u),m=Array(512).fill(0);f.forEach(p=>{for(let c=p.a;c<p.a+p.n&&c<512;c++)m[c]=1});return `<div class="ut"><b>Universe ${u}</b><div class="dots">${m.map(x=>`<i class="${x?"u":""}"></i>`).join("")}</div></div>`}).join("")}</div>
<table class="t"><tr><th>Address</th><th>Fixture</th></tr>${P.slice(18,26).map(p=>`<tr class="${map[p.a].length>1?"redbg":""}"><td>${p.a}</td><td>${p.name}</td></tr>`).join("")}</table>`],
mq:["ChamSys MagicQ","The patch has separate views of the same data, and the output window can chart whole universes. A switch shows received values rather than sent ones.",[["Outputs windows","https://docs.chamsys.co.uk/magicq/manual/outputs_windows.html"],["Patching","https://docs.chamsys.co.uk/magicq/manual/patching.html"]],()=>`<div class="tb">${[["heads","View Heads"],["chans","View Chans"],["dmx","View DMX"]].map(([k,n])=>`<button class="mini ${view===k?"primary":""}" data-v="${k}">${n}</button>`).join("")}<button class="mini ${inputs?"primary":""}" data-i>${inputs?"View Inputs":"View Outputs"}</button></div>
<div class="chart">${map.map((o,c)=>`<i style="height:${inputs?0:o?val(c)/2.55:0}%"></i>`).join("")}</div>
${view==="heads"?`<table class="t"><tr><th>Head</th><th>Type</th><th>Address</th></tr>${P.slice(0,12).map(p=>`<tr><td>${p.name}</td><td>${p.type}</td><td>1-${p.a}</td></tr>`).join("")}</table>`:view==="chans"?`<table class="t"><tr><th>Channel</th><th>Head</th><th>Value</th></tr>${map.slice(25,37).map((o,i)=>`<tr><td>${i+25}</td><td>${o?o[0].name:"Free"}</td><td>${o?val(i+25):""}</td></tr>`).join("")}</table>`:`<table class="t"><tr><th>Head</th><th>DMX start</th><th>Channels</th></tr>${P.slice(20,32).map(p=>`<tr><td>${p.name}</td><td>${p.a}</td><td>${p.n}</td></tr>`).join("")}</table>`}`],
eos:["ETC Eos patch","An address grid sits beside the channel list, one universe at a time. Each address can report its channel, parameter, output and source, and a key temporarily switches address format.",[["Patched vs available addresses","https://support.etcconnect.com/ETC/Consoles/Eos_Family/Software_and_Programming/Where_to_See_Patched_vs_Available_Addresses_and_Universes_in_Eos"],["Address grid thread","https://community.etcconnect.com/control_consoles/eos-family-consoles/f/eos-family/536/patch-address-availability-grid"],["Output view thread","https://community.etcconnect.com/control_consoles/eos-family-consoles/f/eos-family/2365/universe-s-output-view"]],()=>`<div class="tb"><button class="mini" data-f>[Data] Format: ${fmt?"Absolute":"Port/Offset"}</button></div><div class="two"><div class="ag">${map.map((o,c)=>`<i class="${o?"u":""}">${c}</i>`).join("")}</div>
<table class="t"><tr><th>Address</th><th>Channel</th><th>Parameter</th><th>Output</th><th>Source</th></tr>${map.slice(0,40).map((o,c)=>o?`<tr><td>${fmt?c:"1/"+c}</td><td>${o[0].name}</td><td>Intensity</td><td>${val(c)}</td><td>Scene</td></tr>`:"").join("")}</table></div>`],
lw:["Lightwright","A paperwork tool: a dynamic address map of who uses what, next to a worksheet that shows addresses as ranges, one universe at a time.",[["What's new in Lightwright 6","https://mckernon.com/lightwrightmenu/lwnewin6.html"]],()=>`<div class="two"><table class="t"><tr><th>Range</th><th>Fixture</th><th>Type</th></tr>${P.slice(20,44).map(p=>`<tr class="${map[p.a].length>1?"red":""}"><td>${p.n>1?p.a+"-"+(p.a+p.n-1):p.a}</td><td>${p.name}</td><td>${p.type}</td></tr>`).join("")}</table>
<div class="amap">${map.map((o,c)=>`<i class="${o?o.length>1?"x":"u":""}" title="${o?o.map(x=>x.name).join(", "):"free"}">${c}</i>`).join("")}</div></div>`],
};
const key=()=>PAGES[location.hash.slice(1)]?location.hash.slice(1):"ma";
function draw(){const k=key(),p=PAGES[k];$("tabs").innerHTML=Object.entries(PAGES).map(([i,v])=>`<button class="${i===k?"on":""}" data-t="${i}">${v[0]}</button>`).join("");
$("cap").innerHTML=`<h1>${p[0]}</h1><p>${p[1]}</p><p>My reconstruction from public documentation using your patch, in this mockup's own styling. It isn't the real interface, and values are simulated. Sources: ${p[2].map(s=>`<a href="${s[1]}">${s[0]}</a>`).join(", ")}.</p>`;$("pg").innerHTML=p[3]();}
document.addEventListener("click",e=>{const c=s=>e.target.closest(s);if(c("[data-t]"))location.hash=c("[data-t]").dataset.t;else if(c("[data-f]")){fmt=1-fmt;draw()}else if(c("[data-i]")){inputs=!inputs;draw()}else if(c("[data-v]")){view=c("[data-v]").dataset.v;draw()}});
addEventListener("hashchange",draw);draw();
</script></body></html>
