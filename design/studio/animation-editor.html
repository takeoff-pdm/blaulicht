function fn(f,t){const s=(q)=>t%1<q?1:0;t=t%1;switch(f){case"Sin":return(Math.sin(t*2*Math.PI)+1)/2;case"Cos":return(Math.cos(t*2*Math.PI)+1)/2;case"Triangle":return t<.5?t*2:2-t*2;case"Square1_2":return s(.5);case"Square1_8":return s(.125);case"Square1_16":return s(.0625);case"Spike1_8":return t<.125?1-t*8:0;case"ExpSpike1_8":return t<.125?Math.pow(1-t*8,3):0;case"Sawtooth":return t;case"EaseIn":return t*t;case"EaseOut":return 1-(1-t)*(1-t);case"EaseInOut":return t*t*(3-2*t);}return 0;}

function knobSvg(t){const P=(g,r)=>[50+r*Math.cos(g),50+r*Math.sin(g)].map(x=>x.toFixed(1)),st=Math.PI/2+Math.PI*.1,sw=Math.PI*1.8;let k="";for(let i=0;i<=12;i++){const f=i/12,g=st+sw*f,[x1,y1]=P(g,41),[x2,y2]=P(g,i%3?45:48);k+=`<line class="tk ${f<=t?"lit":""}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;}const g=st+sw*t,[px,py]=P(g,29),[qx,qy]=P(g,12);return `<svg viewBox="0 0 100 100" aria-hidden="true">${k}<circle class="fc" cx="50" cy="50" r="36"/><circle class="in" cx="50" cy="50" r="26"/><line class="pt" x1="${qx}" y1="${qy}" x2="${px}" y2="${py}"/></svg>`;}

const V={
Phaser(x,b){const m=b.kind.Mathematical,t=b.time_total,beat="Beat"in t;

};
