cargo-features = ["codegen-backend"]

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true
lto = false
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
incremental = true

[workspace]
members = [
    "./crates/core",
    "./crates/shared",
    "./crates/plugins"
]
resolver = "2"

