cargo-features = ["codegen-backend"]

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
lto = false
incremental = true

[profile.release]
# opt-level = 3
# lto = true
# codegen-units = 1
# incremental = true
debug = true

[workspace]
members = [
    "./crates/core",
    "./crates/shared",
    "./crates/plugin_framework",
    "./crates/audio_engine",
    "./crates/assets",
    # "./blaulicht-analyzer",
]
exclude = [
    "./crates/plugins/drums",
    "./crates/plugins/sample_egui_plugin",
    "./crates/plugins/midi_all",
    "./crates/plugins/visualizer",
    "./crates/plugins/433mhz_antenna",
    "./crates/plugins/videowall",
    "./crates/plugins/test",
    "./crates/plugins/screens",
    "./crates/plugins/ddj_200",
    "./crates/plugins/console",
    "./crates/plugins/player/",
    "./crates/plugins/udp_listener",
    "./crates/plugins/led_tubes",
    "./crates/plugins/sample_animation_plugin",
    "./crates/plugins/chaos_animation_plugin",
    "./crates/plugins/inspector",
    "./crates/plugins/audio_reactor_animation_plugin",
]
resolver = "2"
