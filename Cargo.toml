cargo-features = ["codegen-backend"]

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true
lto = false
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
incremental = true

[workspace]
members = [
    "./crates/core",
    "./crates/shared",
    "./crates/plugin_framework",
    "./crates/audio_engine",
    "./crates/assets",
    "./blaulicht-analyzer",
]
exclude = [
    "./crates/plugins/drums",
    "./crates/plugins/sample_egui_plugin",
    "./crates/plugins/midi_all",
    "./crates/plugins/visualizer",
    "./crates/plugins/433mhz_antenna",
    "./crates/plugins/test",
]
resolver = "2"
