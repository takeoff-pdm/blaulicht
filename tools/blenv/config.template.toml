# blenv container config. run-app.sh copies this to /state/config.toml on every start,
# so runtime rewrites by the app never touch the repo. Plugin ids follow the [[plugins]]
# order below: 0 inspector, 1 julia, 2 audio reactor, 3 chaos, 4 sample egui.
# No hardware plugins (ProDJ link, 433 MHz, MIDI, videowall, LED tubes, screens).
port = 1234
dmx_out_devices = [
    "/dev/dmx_out0",
    "/dev/dmx_out1",
]
default_audio_device = "Dummy: Noise"
run_setup_on_reload = false
spectrogram_window_seconds = 120
spectrogram_refresh_hz = 60
#@LAST_OPEN_SHOWFILE@

[stream]
channel_count = 2
fft_resolution = 2048
gravity = 100.0
refresh_rate = 60

[stream.processor]
frequency_bounds = [
    50,
    20000,
]
interpolation = "Cubic"
position_normalisation = "Harmonic"
sampling_rate = 44100
volume = 1.0
volume_normalisation = "Mixture"

[[plugins]]
file_path = "./crates/plugins/bundle_debug/inspector.wasm"
enabled = true
enable_watcher = true

[[plugins]]
file_path = "./crates/plugins/bundle_debug/julia_animation_plugin.wasm"
enabled = true
enable_watcher = true

[[plugins]]
file_path = "./crates/plugins/bundle_debug/audio_reactor_animation_plugin.wasm"
enabled = true
enable_watcher = true

[[plugins]]
file_path = "./crates/plugins/bundle_debug/chaos_animation_plugin.wasm"
enabled = true
enable_watcher = true

[[plugins]]
file_path = "./crates/plugins/bundle_debug/sample_egui_plugin.wasm"
enabled = true
enable_watcher = true

[plugin_state]
